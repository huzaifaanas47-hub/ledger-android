name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Your Ledger website (https://...)"
        required: true
      version_name:
        description: "Version name, e.g. 1.0.1"
        required: true
        default: "1.0.0"
      version_code:
        description: "Version code (whole number, must increase every release)"
        required: true
        default: "1"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ledger-android
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        working-directory: .
        run: unzip -q ledger-android.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Configure app
        env:
          APP_URL: ${{ inputs.app_url }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: node scripts/configure.js && npx cap sync android
      - name: Build release APK
        working-directory: ledger-android/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          REL=android/app/build/outputs/apk/release
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
          else
            echo "No keystore secrets: using a temporary key (testing only)."
            keytool -genkeypair -keystore release.jks -storepass android -keypass android -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Ledger"
            KS_PASS=android; KEY_ALIAS=key
          fi
          $BT/zipalign -f -p 4 $REL/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks release.jks --ks-pass pass:$KS_PASS --ks-key-alias $KEY_ALIAS --out Ledger-${{ inputs.version_name }}.apk aligned.apk
          $BT/apksigner verify Ledger-${{ inputs.version_name }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ledger-APK
          path: ledger-android/Ledger-*.apk
